name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [perf/auditoria-inicial]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TanStack Start regenerates routeTree.gen.ts during the Vite build.
      - name: Build
        run: bun run build

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
